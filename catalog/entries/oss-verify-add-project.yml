rationale: Teaches how to write a fuzz target that states what "correct" means so that a proof about it is not vacuous. Each property becomes a check that aborts, never assert(), which NDEBUG removes. A coverage witness shows each check runs, and a distinguishing mutant shows each property can fail. Inputs and decoding are total, bounded, and deterministic, and the agent asks the maintainer rather than guessing. These practices carry over to specifying any library for verification or property-based testing.
limitations: Written for enrollment in the OSS Verify service operated by Theorem Labs and meant to run inside the theorem-labs/oss-verify repository; the steps reference its documents, templates, and tools. Its tools/check script builds the project's Dockerfile with network access, and findings and patches from the service are generated by AI models. Listed as examined at the recorded revision; not reviewed or tested by this catalog.
