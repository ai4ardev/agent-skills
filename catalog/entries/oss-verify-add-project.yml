id: oss-verify-add-project
title: "OSS Verify add-project: fuzz targets as formal specifications"
summary: Guides an agent and a project maintainer through enrolling a C, C++, Rust, Python, or Go project in OSS Verify, which proves theorems about the project's fuzz targets.
